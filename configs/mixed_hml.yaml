# Interface example for a 1:1:1 L/M/H case allocation. This is not an exact replay of all five manuscript training recipes or selected checkpoints.
data:
  kind: pdebench_cfd
  root: dataset/pdebench/Processed
  stats_path: dataset/cfd_hml.stats.pt
  selected_fields: [Vx]
  train_fraction: 0.9
  split_seed: 42
  frame_start: 5
  frame_end: 20
  resolution_fractions: {L: 1, M: 1, H: 1}
  eval_resolution: H
model:
  model_name: GL_rbf_ENH
  backbone: GL_rbf_ENH
  coord_dim: 3
  hidden_dim: 128
  cond_dim: 128
  field_embed_dim: 128
  latent_dim: 128
  num_latents: 128
  num_heads: 8
  num_latent_blocks: 3
  ff_mult: 3
  USE_FOURIER_PE: true
  fourier_pe_num_bands: 32
  fourier_pe_max_freq: 64.0
  sensor_coord_encoding: fourier
  latent_sensor_reinject: true
  query_latent_readout: true
  query_readout_type: coord
  query_readout_scale_init: 0.01
  enhanced_head_norm: true
  summary_type: mean
  gather_mode: topk_rbf_glres
  gather_topk: 32
  gather_query_chunk_size: 1024
  neighbor_backend: torch
  rbf_sigma: 0.05
  learnable_rbf_sigma: true
  glres_scale_init: 0.01
  prior: rff
  rff_features: 256
  rff_lengthscale: 0.15
observations:
  fields: [Vx]
  sensors_per_resolution: {L: 32, M: 128, H: 512}
training:
  seed: 42
  epochs: 10000
  batch_size: 384
  query_points: 1024
  learning_rate: 0.0002
  weight_decay: 0.000001
  gradient_clip: 1.0
  validation_samples: 16
  save_every_epochs: 100
evaluation:
  max_samples: 300
  draws: 1
  steps: 2
  solver: euler
  observation_consistency: default_hard
  query_chunk_size: 2048
