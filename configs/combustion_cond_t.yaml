# Paper-correlated Cond-T profile. Uses the five-channel paper dataset.
data:
  kind: combustion
  path: dataset/combustion.h5
  stats_path: dataset/combustion.stats.pt
  train_fraction: 0.9
  split_seed: 42
model:
  model_name: GL_rbf_ENH
  backbone: GL_rbf_ENH
  coord_dim: 3
  hidden_dim: 256
  cond_dim: 128
  field_embed_dim: 128
  latent_dim: 256
  num_latents: 128
  num_heads: 8
  num_latent_blocks: 4
  ff_mult: 4
  USE_FOURIER_PE: true
  fourier_pe_num_bands: 32
  fourier_pe_max_freq: 64.0
  sensor_coord_encoding: fourier
  latent_sensor_reinject: true
  latent_reinject_every: 1
  query_latent_readout: true
  query_readout_type: coord
  query_readout_scale_init: 0.01
  enhanced_head_norm: true
  summary_type: mean
  gather_mode: topk_rbf_glres
  gather_topk: 32
  sensor_local_topk: 16
  gather_query_chunk_size: 2048
  neighbor_backend: torch # PyKeOps is optional; this keeps the same model mathematics.
  rbf_sigma: 0.05
  learnable_rbf_sigma: true
  glres_scale_init: 0.01
  prior: rff
  rff_features: 256
  rff_lengthscale: 0.15
observations:
  fields: [T]
  train_sensors_per_field: {min: 192, max: 384}
  evaluation_sensors_per_field: 256
training:
  seed: 42
  epochs: 10000
  batch_size: 128
  query_points: 4096
  learning_rate: 0.0001
  weight_decay: 0.000001
  gradient_clip: 1.0
  validation_samples: 16
  save_every_epochs: 100
evaluation:
  max_samples: 1000
  draws: 1
  steps: 2
  solver: euler
  observation_consistency: default_hard
  query_chunk_size: 2048
