[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmf-gen"
version = "0.1.0"
description = "Paper-correlated direct measurement-to-field generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.24",
  "h5py>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]
keops = ["pykeops>=2.2"]
plot = ["matplotlib>=3.7"]
physics = ["scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
dmf-train = "dmf_gen.cli.train:main"
dmf-evaluate = "dmf_gen.cli.evaluate:main"
dmf-reconstruct = "dmf_gen.cli.reconstruct:main"
dmf-plot = "dmf_gen.cli.plot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/dmf_gen/models/*.py" = ["E501"]
